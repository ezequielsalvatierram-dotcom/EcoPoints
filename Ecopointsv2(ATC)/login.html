<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión de la plataforma EcoPoints.">
    <title>EcoPoints | Iniciar sesión</title>
    <link rel="icon" type="image/svg+xml" href="img/ecopoints-icon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
    <main class="login-card">
        <a class="login-brand" href="login.html" aria-label="EcoPoints - Inicio">
            <span class="login-logo" aria-hidden="true">E</span>
            <span>EcoPoints</span>
        </a>

        <div class="login-heading">
            <h1>Bienvenido</h1>
            <p>Ingresa a tu cuenta para continuar cuidando el planeta.</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label class="form-label" for="loginEmail">Correo electrónico</label>
                <input
                    class="form-control"
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="usuario@ecopoints.com"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="loginPassword">Contraseña</label>
                <input
                    class="form-control"
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >
            </div>

            <p id="loginMessage" class="login-message" role="alert" aria-live="polite"></p>

            <button class="btn btn-primary login-submit" type="submit">
                
                Iniciar sesión
            </button>
        </form>

        <div class="login-demo">
            <strong>Cuenta de ejemplo</strong>
            <span>Correo: usuario@ecopoints.com</span>
            <span>Contraseña: 123456</span>
        </div>

        <p class="auth-switch">¿Todavía no tienes una cuenta? <a href="register.html">Regístrate aquí</a></p>
        <p class="login-footer">Pequeñas acciones generan grandes cambios.</p>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
